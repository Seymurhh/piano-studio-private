<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Frame bench</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #000; color: #ccc; font: 13px/1.4 system-ui, sans-serif; }
  canvas#stage { display: block; }
  #bar { display: flex; gap: 10px; align-items: center; padding: 8px 12px; }
  #bar input[type=range] { flex: 1; }
  #bar[hidden] { display: none; }
  #msg { padding: 8px 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="bar" hidden><span id="tlabel">t = 0.00 s</span><input type="range" id="scrub" min="0" max="1" step="0.01" value="0" aria-label="Music time"></div>
<p id="msg" role="status">Loading…</p>
<script type="module" src="frame.js"></script>
</body>
</html>
